<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Filament Monitoring</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-h: 210;
            --primary-s: 60%;
            --primary-l: 55%;
            --bg-gradient: linear-gradient(135deg, hsl(210, 40%, 20%), hsl(210, 30%, 10%));
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-blur: 12px;
            --text-color: #fff;
            --accent: hsl(var(--primary-h), 70%, 65%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(var(--card-blur));
            border-radius: 16px;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 500;
            color: var(--accent);
        }
        .reading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            transition: background 0.2s;
        }
        .reading:hover {
            background: rgba(255,255,255,0.12);
        }
        .label { font-size: 1rem; font-weight: 500; }
        .value { font-size: 1.2rem; font-weight: 700; }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Filament Monitoring</h1>
        <div class="reading" id="tempCard">
            <span class="label">Suhu Panas (°C)</span>
            <span class="value" id="tempValue">--</span>
        </div>
        <div class="reading" id="powerCard">
            <span class="label">Listrik (W)</span>
            <span class="value" id="powerValue">--</span>
        </div>
        <div class="reading" id="lengthCard">
            <span class="label">Panjang Filament (mm)</span>
            <span class="value" id="lengthValue">--</span>
        </div>
        <div class="footer">Powered by ESP32 & MQTT</div>
    </div>

    <!-- Paho MQTT client (WebSocket) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/mqttws31.min.js" integrity="sha512-0uQbX0JcD5cE+NwJH/9RZl5Xl3a6iM5cUHlN4pLzK5v6f+4zGc3p1k8Uq1dXKR4p9dD+8WbTjv4iJj0uK6Dqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // ==== MQTT SETTINGS ====
        // Replace the following values with your own broker configuration if you host your own MQTT broker.
        // Example public broker (WebSocket): HiveMQ public broker
        const brokerUrl = 'wss://broker.hivemq.com:8000/mqtt'; // WebSocket secure URL
        const clientId = 'webclient_' + Math.random().toString(16).substr(2, 8);
        const topics = {
            temperature: 'esp32/temperature', // payload: numeric (°C)
            power: 'esp32/power',           // payload: numeric (W)
            filament: 'esp32/filament'      // payload: numeric (mm)
        };

        const client = new Paho.MQTT.Client(brokerUrl, clientId);
        client.onConnectionLost = function (responseObject) {
            console.log('Connection lost:', responseObject.errorMessage);
        };
        client.onMessageArrived = function (message) {
            const topic = message.destinationName;
            const payload = message.payloadString;
            if (topic === topics.temperature) {
                document.getElementById('tempValue').textContent = payload;
            } else if (topic === topics.power) {
                document.getElementById('powerValue').textContent = payload;
            } else if (topic === topics.filament) {
                document.getElementById('lengthValue').textContent = payload;
            }
        };

        const options = {
            timeout: 3,
            keepAliveInterval: 60,
            onSuccess: function () {
                console.log('MQTT connected');
                client.subscribe(topics.temperature);
                client.subscribe(topics.power);
                client.subscribe(topics.filament);
            },
            onFailure: function (err) {
                console.error('MQTT connection failed', err);
            }
        };
        client.connect(options);
    </script>
</body>
</html>
