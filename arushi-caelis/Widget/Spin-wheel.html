<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Semanggi Spin Wheel | Dynamic Dark/Light Mode</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS dengan variable warna & mode berdasarkan jam -->
    <style>
        /* ========== VARIABEL WARNA (LIGHT MODE DEFAULT) ========== */
        :root {
            --ica-primary: #96E04E;
            --ica-secondary: #82CD3B;
            --ica-vein: #6CA832;
            --ica-outline: #3B5E1C;
            --ica-bg-light: #F4F9EE;
            --ica-card-hover: #e9f5df;
            --dark-bg: #121A0F;
            --dark-surface: #1E2A18;
            --dark-surface-2: #2A3822;
            --dark-text: #E6F0DC;
            --dark-text-muted: #B8D0A4;
            
            /* Default light mode variables */
            --bg-body: var(--ica-bg-light);
            --bg-surface: white;
            --bg-card: white;
            --text-primary: #1e2a1a;
            --text-secondary: #2d3e2b;
            --border-color: #d4b87a;
            --btn-primary: var(--ica-primary);
            --btn-primary-hover: #7fc93b;
            --shadow-color: rgba(0,0,0,0.1);
        }
        
        /* Dark mode class - akan diterapkan ke body saat waktu gelap */
        body.dark-mode {
            --bg-body: var(--dark-bg);
            --bg-surface: var(--dark-surface);
            --bg-card: var(--dark-surface-2);
            --text-primary: var(--dark-text);
            --text-secondary: var(--dark-text-muted);
            --border-color: #4a6b2f;
            --btn-primary: var(--ica-primary);
            --btn-primary-hover: #6ca832;
            --shadow-color: rgba(0,0,0,0.5);
        }
        
        body {
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.2s ease;
            font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
        }
        
        /* Custom styling untuk komponen */
        .card-glass {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px var(--shadow-color);
        }
        
        .wheel-container {
            position: relative;
            display: inline-block;
        }
        
        .pointer-tip {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-top: 60px solid #ffbb44;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.3));
            z-index: 20;
        }
        
        .pointer-tip::after {
            content: "✨";
            position: absolute;
            font-size: 28px;
            top: -62px;
            left: -18px;
        }
        
        .center-clover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 23%;
            max-width: 100px;
            min-width: 60px;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            z-index: 15;
        }
        
        /* Animasi semanggi bergerak */
        @keyframes slideShake {
            0% { transform: translateX(-25px) rotate(-5deg); }
            50% { transform: translateX(35px) rotate(5deg); }
            100% { transform: translateX(-25px) rotate(-5deg); }
        }
        
        .moving-clover {
            animation: slideShake 1.6s ease-in-out infinite;
            filter: drop-shadow(0 5px 8px #2f5e2e);
            width: 60px;
        }
        
        .moving-clover:nth-child(2) { animation-duration: 2.1s; animation-delay: 0.2s; }
        .moving-clover:nth-child(3) { animation-duration: 1.9s; animation-delay: 0.6s; }
        
        /* Scrollbar custom */
        .prize-list::-webkit-scrollbar, .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .prize-list::-webkit-scrollbar-track {
            background: var(--dark-surface);
            border-radius: 10px;
        }
        .prize-list::-webkit-scrollbar-thumb {
            background: var(--ica-primary);
            border-radius: 10px;
        }
        
        /* Tombol spin */
        .btn-spin {
            background: linear-gradient(135deg, var(--ica-primary), var(--ica-secondary));
            transition: all 0.1s ease;
        }
        .btn-spin:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 var(--ica-outline);
        }
        
        /* Overlay hasil */
        .overlay-result {
            transition: visibility 0s, opacity 0.3s ease;
        }
        
        /* Mode badge */
        .mode-badge {
            background: var(--ica-vein);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-5 min-h-screen transition-colors duration-300">

<div class="max-w-7xl w-full mx-auto rounded-[3rem] p-5 md:p-7 card-glass">
    <!-- Header dengan badge mode -->
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide" style="color: var(--ica-primary); text-shadow: 2px 2px 0 var(--ica-outline);">🍀 SEMANGGI SPIN PRO 🍀</h1>
        <div id="modeBadge" class="mode-badge">🌞 Mode Terang</div>
    </div>
    
    <div class="flex flex-col lg:flex-row gap-6 mt-4">
        <!-- KOLOM KIRI: RODA -->
        <div class="lg:w-2/5 flex flex-col items-center">
            <div class="wheel-container w-full max-w-[400px] mx-auto relative">
                <canvas id="wheelCanvas" width="500" height="500" class="w-full h-auto rounded-full shadow-2xl border-8 border-[#f7d44a] ring-4 ring-[#b97f2e] bg-[#f8e3b0] cursor-pointer"></canvas>
                <img id="centerCloverImg" class="center-clover" 
                     src="https://raw.githubusercontent.com/celestialdemonbeast/VData/main/arushi-caelis/Image/Semanggi.png" 
                     alt="semanggi tengah"
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%233a7e3a%22/%3E%3Cpath fill=%22%23f9d56e%22 d=%22M50 20 L58 42 L82 42 L63 56 L71 78 L50 64 L29 78 L37 56 L18 42 L42 42 Z%22/%3E%3C/svg%3E';">
                <div class="pointer-tip"></div>
            </div>
            <button id="spinButton" class="btn-spin mt-6 text-2xl font-bold py-3 px-8 rounded-full shadow-lg text-[#2e241f] w-64 tracking-wide hover:brightness-105 active:translate-y-1 transition-all">🎡 SPIN 🍀</button>
        </div>
        
        <!-- KOLOM TENGAH: EDIT HADIAH (dengan tombol hapus per segmen) -->
        <div class="lg:w-1/3 rounded-3xl p-5 card-glass">
            <h2 class="text-xl font-bold text-center border-b pb-2 mb-3" style="color: var(--ica-primary); border-color: var(--ica-secondary);">✏️ ATUR HADIAH (SEGMEN)</h2>
            <div class="flex gap-3 mb-4">
                <button id="addSegmentBtn" class="flex-1 py-2 rounded-full font-bold shadow-md transition-all hover:brightness-105 active:translate-y-0.5" style="background: var(--ica-primary); color: #1e2a1a;">➕ Tambah Segmen</button>
            </div>
            <div id="prizeInputsContainer" class="prize-list max-h-96 overflow-y-auto space-y-2 pr-1">
                <!-- daftar segmen dengan tombol hapus masing-masing akan dirender JS -->
            </div>
            <button id="updateWheelBtn" class="w-full mt-4 py-2 rounded-full font-bold shadow-md transition-all hover:brightness-105 active:translate-y-0.5" style="background: var(--ica-secondary); color: #1e2a1a;">🔄 SIMPAN & GAMBAR ULANG</button>
            <p class="text-xs text-center mt-2 opacity-80">⚠️ Min 2 segmen | Maks 24 segmen | Klik ❌ hapus segmen</p>
        </div>
        
        <!-- KOLOM KANAN: HISTORY & TOTAL -->
        <div class="lg:w-1/3 rounded-3xl p-5 card-glass flex flex-col">
            <h2 class="text-xl font-bold text-center border-b pb-2 mb-3" style="color: var(--ica-primary); border-color: var(--ica-secondary);">📜 HISTORY SPIN</h2>
            <div id="historyList" class="history-list rounded-2xl p-3 h-64 overflow-y-auto space-y-2" style="background: var(--dark-surface);">
                <div class="text-center opacity-70">Belum ada spin</div>
            </div>
            <div id="totalValue" class="mt-4 text-center font-bold text-xl py-2 rounded-full" style="background: var(--ica-primary); color: #1e2a1a;">✨ Total Menit: 0 ✨</div>
            <button id="resetHistoryBtn" class="mt-3 py-2 rounded-full font-bold transition active:scale-95" style="background: var(--ica-vein); color: white;">🗑️ Reset History</button>
        </div>
    </div>
    
    <!-- SEMANGGI BERGERAK KE KANAN KIRI -->
    <div class="flex justify-center gap-8 mt-8 flex-wrap">
        <img class="moving-clover" src="https://raw.githubusercontent.com/celestialdemonbeast/VData/main/arushi-caelis/Image/Semanggi.png" alt="semanggi" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232d6a2d%22/%3E%3Cpath fill=%22%23ffd966%22 d=%22M50 25 L57 44 L76 44 L61 57 L68 76 L50 63 L32 76 L39 57 L24 44 L43 44 Z%22/%3E%3C/svg%3E';">
        <img class="moving-clover" src="https://raw.githubusercontent.com/celestialdemonbeast/VData/main/arushi-caelis/Image/Semanggi.png" alt="semanggi" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232d6a2d%22/%3E%3Cpath fill=%22%23ffd966%22 d=%22M50 25 L57 44 L76 44 L61 57 L68 76 L50 63 L32 76 L39 57 L24 44 L43 44 Z%22/%3E%3C/svg%3E';">
        <img class="moving-clover" src="https://raw.githubusercontent.com/celestialdemonbeast/VData/main/arushi-caelis/Image/Semanggi.png" alt="semanggi" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232d6a2d%22/%3E%3Cpath fill=%22%23ffd966%22 d=%22M50 25 L57 44 L76 44 L61 57 L68 76 L50 63 L32 76 L39 57 L24 44 L43 44 Z%22/%3E%3C/svg%3E';">
    </div>
    <p class="text-center text-sm mt-3 px-5 py-1 rounded-full w-fit mx-auto opacity-80" style="background: var(--dark-surface);">🍀 Klik SPIN, setiap hasil tercatat & total menit otomatis dihitung! Tambah/Hapus segmen sesukamu 🍀</p>
</div>

<!-- OVERLAY HASIL SPIN -->
<div id="resultOverlay" class="overlay-result fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 invisible opacity-0 transition-all duration-300">
    <div class="max-w-md w-[85%] rounded-[3rem] p-8 text-center shadow-2xl border-4" style="background: var(--bg-card); border-color: var(--ica-primary);">
        <h2 class="text-4xl font-black" style="color: var(--ica-primary);">🎉 SELAMAT! 🎉</h2>
        <div id="prizeDisplay" class="text-3xl md:text-4xl font-extrabold inline-block px-6 py-3 rounded-full my-6" style="background: var(--ica-vein); color: white;">---</div>
        <img class="w-24 mx-auto my-3 animate-pulse" src="https://raw.githubusercontent.com/celestialdemonbeast/VData/main/arushi-caelis/Image/Semanggi.png" alt="semanggi" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%233a7e3a%22/%3E%3Cpath fill=%22%23ffd966%22 d=%22M50 25 L57 44 L76 44 L61 57 L68 76 L50 63 L32 76 L39 57 L24 44 L43 44 Z%22/%3E%3C/svg%3E';">
        <button id="closeOverlayBtn" class="font-bold py-2 px-6 rounded-full shadow-md active:translate-y-0.5 transition" style="background: var(--ica-secondary); color: #1e2a1a;">Tutup & Lanjut Spin 🍀</button>
    </div>
</div>

<script>
    (function(){
        // ---------- DEFAULT HADIAH (12 SEGMEN MENIT) ----------
        const DEFAULT_PRIZES = [
            "+⌚ 1 Menit", "+⌚ 1 Menit", "+⌚ 1 Menit",
            "+⌚ 2 Menit", "+⌚ 2 Menit", "+⌚ 2 Menit",
            "+⌚ 5 Menit", "+⌚ 5 Menit",
            "+⌚ 10 Menit", "+⌚ 10 Menit", "+⌚ 10 Menit", "+⌚ 10 Menit"
        ];
        const COLOR_PALETTE = [
            "#F9A26C","#F7D06F","#9FD9B4","#F4A261","#E9C46A","#6FBF73",
            "#E76F51","#7CB77C","#F4A261","#9FD9B4","#F7D06F","#F9A26C",
            "#A7D0CD","#F6AE92","#B5E3A3","#FFB347","#D98C5F","#9EC1A3",
            "#F3B33D","#6B8E6B","#E59866","#82B74E","#F2C94C","#D4A373"
        ];
        
        // State global
        let SEGMENTS = [];
        let SEG_COUNT = 0;
        let ANGLE_STEP = 0;
        
        // Canvas
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const size = 500;
        canvas.width = size;
        canvas.height = size;
        const centerX = size/2, centerY = size/2;
        const radius = size * 0.45;
        
        // Animasi
        let currentRotation = 0.35;
        let spinning = false;
        let animationId = null;
        let spinDuration = 1800;
        let startRotation = 0, targetRotation = 0, spinStartTime = 0;
        
        // History
        let history = [];
        
        // DOM
        const spinBtn = document.getElementById('spinButton');
        const overlay = document.getElementById('resultOverlay');
        const prizeDisplaySpan = document.getElementById('prizeDisplay');
        const closeBtn = document.getElementById('closeOverlayBtn');
        const updateBtn = document.getElementById('updateWheelBtn');
        const prizeContainer = document.getElementById('prizeInputsContainer');
        const historyDiv = document.getElementById('historyList');
        const totalSpan = document.getElementById('totalValue');
        const resetHistoryBtn = document.getElementById('resetHistoryBtn');
        const addSegmentBtn = document.getElementById('addSegmentBtn');
        
        // Helper: ekstrak angka dari string hadiah
        function extractNumber(prizeStr) {
            const match = prizeStr.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }
        
        // Update history UI
        function updateHistoryUI() {
            if (history.length === 0) {
                historyDiv.innerHTML = '<div class="text-center opacity-70">Belum ada spin</div>';
                totalSpan.innerHTML = '✨ Total Menit: 0 ✨';
                return;
            }
            let total = 0;
            let html = '';
            for (let i = history.length-1; i >= 0; i--) {
                const h = history[i];
                total += h.value;
                html += `
                    <div class="rounded-full flex justify-between items-center p-2 shadow-sm" style="background: var(--bg-card); color: var(--text-primary);">
                        <span class="font-bold">🍀 ${h.prizeName}</span>
                        <span class="px-3 py-0.5 rounded-full font-semibold" style="background: var(--ica-primary); color: #1e2a1a;">+${h.value} menit</span>
                    </div>
                `;
            }
            historyDiv.innerHTML = html;
            totalSpan.innerHTML = `✨ Total Menit: ${total} ✨`;
        }
        
        function addHistory(prizeName, value) {
            history.push({ prizeName, value });
            updateHistoryUI();
        }
        
        function resetHistory() { history = []; updateHistoryUI(); }
        
        // Fungsi roda
        function drawWheel(rotationRad) {
            ctx.clearRect(0, 0, size, size);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotationRad);
            for (let i = 0; i < SEG_COUNT; i++) {
                const start = i * ANGLE_STEP;
                const end = (i+1) * ANGLE_STEP;
                ctx.beginPath();
                ctx.fillStyle = SEGMENTS[i].color;
                ctx.moveTo(0,0);
                ctx.arc(0,0, radius, start, end);
                ctx.fill();
                ctx.save();
                ctx.strokeStyle = "#F9E0A0";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0,0, radius, start, end);
                ctx.stroke();
                ctx.restore();
                // Teks
                ctx.save();
                ctx.rotate(start + ANGLE_STEP/2);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const textRadius = radius * 0.7;
                ctx.font = "bold 14px 'Segoe UI', 'Quicksand'";
                ctx.fillStyle = "#2F2E1F";
                let prizeText = SEGMENTS[i].name;
                if (prizeText.length > 14) prizeText = prizeText.slice(0,12)+"..";
                ctx.fillText(prizeText, textRadius, 5);
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.19, 0, Math.PI*2);
            ctx.fillStyle = "#FFF3CF";
            ctx.fill();
            ctx.strokeStyle = "#D4AF37";
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();
        }
        
        function getPrizeIndex(rotationRad) {
            const pointerAngle = -Math.PI / 2;
            let rawAngle = (rotationRad + pointerAngle) % (Math.PI * 2);
            if (rawAngle < 0) rawAngle += (Math.PI * 2);
            return Math.floor(rawAngle / ANGLE_STEP) % SEG_COUNT;
        }
        
        function showResult(prizeName) {
            prizeDisplaySpan.innerText = prizeName;
            overlay.classList.remove('invisible', 'opacity-0');
            overlay.classList.add('visible', 'opacity-100');
        }
        function hideOverlay() {
            overlay.classList.add('invisible', 'opacity-0');
            overlay.classList.remove('visible', 'opacity-100');
        }
        
        // Animasi spin
        function easeOutCubic(t) { return 1 - Math.pow(1-t, 3); }
        function animateSpin(now) {
            const elapsed = now - spinStartTime;
            let t = Math.min(1, elapsed / spinDuration);
            const ease = easeOutCubic(t);
            const newRotation = startRotation + (targetRotation - startRotation) * ease;
            currentRotation = newRotation;
            drawWheel(currentRotation);
            if (t < 1) {
                animationId = requestAnimationFrame(animateSpin);
            } else {
                currentRotation = targetRotation % (Math.PI * 2);
                drawWheel(currentRotation);
                const finalIdx = getPrizeIndex(currentRotation);
                const prizeWon = SEGMENTS[finalIdx].name;
                const angka = extractNumber(prizeWon);
                addHistory(prizeWon, angka);
                showResult(prizeWon);
                spinning = false;
                spinBtn.disabled = false;
                if (animationId) cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        
        function startSpin() {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            const extraSpins = (Math.floor(Math.random() * 8) + 5) * Math.PI * 2;
            const randomOffset = Math.random() * Math.PI * 2;
            targetRotation = currentRotation + extraSpins + randomOffset;
            startRotation = currentRotation;
            spinStartTime = performance.now();
            animationId = requestAnimationFrame(animateSpin);
        }
        
        // ---------------- MANAJEMEN SEGMEN DINAMIS (HAPUS PER ITEM) ----------------
        function renderSegmenInputs() {
            prizeContainer.innerHTML = "";
            for (let i = 0; i < SEGMENTS.length; i++) {
                const seg = SEGMENTS[i];
                const div = document.createElement('div');
                div.className = "flex items-center gap-2 rounded-full pl-3 pr-1 py-1";
                div.style.background = "var(--dark-surface)";
                const idxSpan = document.createElement('span');
                idxSpan.className = "w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm";
                idxSpan.style.background = "var(--ica-primary)";
                idxSpan.style.color = "#1e2a1a";
                idxSpan.innerText = i+1;
                const input = document.createElement('input');
                input.type = "text";
                input.value = seg.name;
                input.className = "flex-1 rounded-full px-3 py-1.5 font-semibold text-sm outline-none";
                input.style.background = "var(--bg-card)";
                input.style.color = "var(--text-primary)";
                const delBtn = document.createElement('button');
                delBtn.innerHTML = "❌";
                delBtn.className = "text-sm rounded-full w-8 h-8 flex items-center justify-center font-bold transition hover:opacity-80";
                delBtn.style.background = "#e76f51";
                delBtn.style.color = "white";
                delBtn.onclick = (function(index) { return function() { removeSegmentAtIndex(index); }; })(i);
                div.appendChild(idxSpan);
                div.appendChild(input);
                div.appendChild(delBtn);
                prizeContainer.appendChild(div);
            }
        }
        
        function removeSegmentAtIndex(index) {
            if (SEGMENTS.length <= 2) {
                alert("Minimal 2 segmen! Roda tidak boleh kurang dari 2.");
                return;
            }
            SEGMENTS.splice(index, 1);
            SEG_COUNT = SEGMENTS.length;
            ANGLE_STEP = (Math.PI * 2) / SEG_COUNT;
            renderSegmenInputs();
            drawWheel(currentRotation);
        }
        
        function addSegment() {
            if (SEGMENTS.length >= 24) {
                alert("Maksimal 24 segmen agar tampilan tetap rapi.");
                return;
            }
            const newName = "➕ Hadiah Baru";
            const newColor = COLOR_PALETTE[SEGMENTS.length % COLOR_PALETTE.length];
            SEGMENTS.push({ name: newName, color: newColor });
            SEG_COUNT = SEGMENTS.length;
            ANGLE_STEP = (Math.PI * 2) / SEG_COUNT;
            renderSegmenInputs();
            drawWheel(currentRotation);
        }
        
        function syncSegmentsFromInputs() {
            const inputs = document.querySelectorAll('#prizeInputsContainer input');
            if (inputs.length !== SEGMENTS.length) return;
            for (let i = 0; i < inputs.length; i++) {
                let newName = inputs[i].value.trim();
                if (newName === "") newName = `Hadiah ${i+1}`;
                SEGMENTS[i].name = newName;
            }
            drawWheel(currentRotation);
        }
        
        function updateWheelAndSave() {
            syncSegmentsFromInputs();
            const original = updateBtn.innerText;
            updateBtn.innerText = "✔️ TERSIMPAN!";
            setTimeout(() => { updateBtn.innerText = original; }, 800);
        }
        
        // ---------- MODE GELAP/TERANG BERDASARKAN JAM ----------
        function setThemeByHour() {
            const now = new Date();
            const hours = now.getHours();
            const body = document.body;
            const modeBadge = document.getElementById('modeBadge');
            // Jam 18:00 sampai 05:59 -> dark mode
            if (hours >= 18 || hours < 6) {
                body.classList.add('dark-mode');
                if (modeBadge) modeBadge.innerHTML = "🌙 Mode Gelap";
            } else {
                body.classList.remove('dark-mode');
                if (modeBadge) modeBadge.innerHTML = "☀️ Mode Terang";
            }
        }
        
        // Jalankan saat load dan update setiap menit
        setThemeByHour();
        setInterval(setThemeByHour, 60000);
        
        // ---------- INITIALISASI AWAL ----------
        function init() {
            for (let i = 0; i < DEFAULT_PRIZES.length; i++) {
                SEGMENTS.push({
                    name: DEFAULT_PRIZES[i],
                    color: COLOR_PALETTE[i % COLOR_PALETTE.length]
                });
            }
            SEG_COUNT = SEGMENTS.length;
            ANGLE_STEP = (Math.PI * 2) / SEG_COUNT;
            renderSegmenInputs();
            drawWheel(currentRotation);
            
            spinBtn.addEventListener('click', startSpin);
            updateBtn.addEventListener('click', updateWheelAndSave);
            closeBtn.addEventListener('click', hideOverlay);
            overlay.addEventListener('click', (e) => { if(e.target === overlay) hideOverlay(); });
            resetHistoryBtn.addEventListener('click', resetHistory);
            addSegmentBtn.addEventListener('click', addSegment);
            
            updateHistoryUI();
            
            // fallback gambar
            const centerImg = document.getElementById('centerCloverImg');
            if(centerImg) centerImg.onerror = () => { centerImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2335752e'/%3E%3Cpath fill='%23ffdd99' d='M50 22 L58 43 L80 43 L62 57 L71 78 L50 64 L29 78 L38 57 L20 43 L42 43 Z'/%3E%3C/svg%3E"; };
            const movings = document.querySelectorAll('.moving-clover');
            movings.forEach(img => {
                img.onerror = function() { this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2335752e'/%3E%3Cpath fill='%23ffdd99' d='M50 22 L58 43 L80 43 L62 57 L71 78 L50 64 L29 78 L38 57 L20 43 L42 43 Z'/%3E%3C/svg%3E"; };
            });
        }
        
        init();
    })();
</script>
</body>
</html>
