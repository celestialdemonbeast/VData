<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiClover Clock Widget - ArushiCaelis</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
}

.scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: 20px 130px 10px;
}

.clover-left, .clover-right {
  position: absolute;
  top: 50%;
  z-index: 2;
}
.clover-left  { left: 0;   transform: translateY(-58%); animation: swayL 3.5s ease-in-out infinite; }
.clover-right { right: 0;  transform: translateY(-58%); animation: swayR 3.5s ease-in-out infinite; }

@keyframes swayL {
  0%,100% { transform: translateY(-58%) rotate(-6deg) scale(1);    }
  50%     { transform: translateY(-64%) rotate(3deg)  scale(1.04); }
}
@keyframes swayR {
  0%,100% { transform: translateY(-58%) rotate(6deg)  scale(1);    }
  50%     { transform: translateY(-64%) rotate(-3deg) scale(1.04); }
}

.clover-left img, .clover-right img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(60,140,60,0.35));
}
.clover-right img { transform: scaleX(-1); }

.clock-body {
  position: relative;
  width: 320px;
  background: linear-gradient(160deg, #d4f5d4 0%, #b8eab8 50%, #9ddf9d 100%);
  border-radius: 42px;
  padding: 18px 22px 16px;
  border: 3px solid #fff;
  box-shadow: 0 6px 0 #7ecb7e, 0 10px 0 rgba(100,180,100,0.25), 0 18px 40px rgba(80,160,80,0.25), inset 0 2px 8px rgba(255,255,255,0.7);
  z-index: 3;
}

.snooze-btn {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  width: 52px;
  height: 20px;
  background: linear-gradient(to bottom, #a8e6a8, #7ecb7e);
  border-radius: 20px 20px 8px 8px;
  border: 2.5px solid #fff;
  box-shadow: 0 3px 0 #7ecb7e;
  cursor: pointer;
}

.lcd-screen {
  background: linear-gradient(160deg, #1a2e1a, #0f1f0f);
  border-radius: 26px;
  padding: 16px 14px 12px;
  position: relative;
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: inset 0 3px 14px rgba(0,0,0,0.6);
}

.time-display { font-family: 'Fredoka One', cursive; font-size: 74px; color: #5dff80; text-align: center; line-height: 1; }

.clock-base {
  width: 300px;
  margin-top: -6px;
  background: linear-gradient(160deg, #3b5bdb, #2f4bc4);
  border-radius: 0 0 28px 28px;
  border: 3px solid #fff;
  border-top: none;
  padding: 10px 18px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  z-index: 2;
  position: relative;
}

.platform-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  overflow: hidden;
}

/* Memastikan gambar ikon pas di kotak */
.platform-icon img { width: 100%; height: 100%; object-fit: cover; }
.platform-icon svg { width: 20px; height: 20px; }

.social-handle { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 900; color: white; }
.social-slide { display: flex; align-items: center; gap: 10px; animation: popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes popIn { from { opacity:0; transform: scale(0.7) translateY(8px); } to { opacity:1; transform: scale(1) translateY(0); } }

.progress-track { position: absolute; bottom: 0; left: 0; height: 3px; background: rgba(255,255,255,0.12); width: 100%; border-radius: 0 0 28px 28px; }
.progress-fill { height: 100%; background: rgba(255,255,255,0.55); width: 0%; transition: width 1s linear; }
</style>
</head>
<body>

<div class="scene">
  <div class="clover-right"><img src="https://github.com/celestialdemonbeast/VData/blob/main/arushi-caelis/Image/Semanggi.png?raw=true"></div>
  <div class="clover-left"><img src="https://github.com/celestialdemonbeast/VData/blob/main/arushi-caelis/Image/Semanggi.png?raw=true"></div>

  <div class="clock-body">
    <button class="snooze-btn"></button>
    <div class="lcd-screen">
      <div class="time-display"><span id="hours">12</span>:<span id="minutes">00</span></div>
      <div id="date-display" style="text-align:center; color:#3daa52; font-size:20px; margin-top:5px;"></div>
    </div>
  </div>

  <div class="clock-base">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="social-content"></div>
  </div>
</div>

<script>
const socials = [
  { name: '@ArushiCaelis', type: 'img', content: 'https://github.com/celestialdemonbeast/VData/blob/main/assets/X.png?raw=true' },
  { name: '@ArushiCaelis', type: 'img', content: 'https://github.com/celestialdemonbeast/VData/blob/main/assets/Instagram.png?raw=true' },
  { name: 'Trakteer', type: 'img', content: 'https://github.com/celestialdemonbeast/VData/blob/main/assets/Traktear.png?raw=true' },
  { name: 'Tako.id', type: 'img', content: 'https://github.com/celestialdemonbeast/VData/blob/main/assets/Tako.png?raw=true' }
];

let currentIndex = 0;
let secondsLeft = 60;

function renderSocial() {
  const soc = socials[currentIndex];
  const container = document.getElementById('social-content');
  
  let iconHtml = soc.type === 'img' 
    ? `<img src="${soc.content}" alt="icon">` 
    : soc.content;

  container.innerHTML = `
    <div class="social-slide">
      <div class="platform-icon">${iconHtml}</div>
      <span class="social-handle">${soc.name}</span>
    </div>
  `;
}

function updateClock() {
  const now = new Date();
  document.getElementById('hours').textContent = String(now.getHours() % 12 || 12).padStart(2, '0');
  document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
  
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('date-display').textContent = `${days[now.getDay()]} · ${months[now.getMonth()]} ${now.getDate()}`;
  
  document.getElementById('progress-fill').style.width = (((60 - secondsLeft) / 60) * 100) + '%';
  
  if (--secondsLeft < 0) {
    secondsLeft = 60;
    currentIndex = (currentIndex + 1) % socials.length;
    renderSocial();
  }
}

renderSocial();
setInterval(updateClock, 1000);
</script>
</body>
</html>
